id: darknode
name: DarkNode
type: DARKNODE_TEST
faction: UNDERGROUND
location: { x: 42, y: 38 }
servers:
  - id: practice-machine
    name: DarkNode Practice Machine
    ip: 10.0.0.1
    security: 1
    files:
      - path: /readme.txt
        size_mb: 1
        content: |
          This machine is here to be broken into. Nothing on it matters and
          nobody watches it. Try your programs, read the files, clear the log
          afterwards, and get out. When that feels easy, try something that
          belongs to somebody.
      - path: /usr/notes.txt
        size_mb: 1
        content: |
          Order of work, every time:
            1. Plan a route through relays, so a trace has ground to cover.
            2. Connect.
            3. Open the layers the server has, outermost first.
            4. Do what you came for.
            5. Clear your lines from the log, here and on every relay.
            6. Leave before the trace arrives.
