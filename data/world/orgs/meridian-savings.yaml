# One of the three servers the game's numbers are balanced against: security 6
# with a proxy, a firewall and a monitor. It is also the bank a new agent's
# first account is held at, so it is read long before it can be broken into.
# Break-in time, trace rate and the deadline the administrator sets were all
# worked out against exactly this configuration, so a change to the security
# level or to the layers here is a change to the balance of the whole game.

id: meridian-savings
name: Meridian Savings
type: BANK
faction: CORPORATE
location: { x: 60, y: 30 }
servers:
  - id: meridian-savings
    name: Meridian Savings
    ip: 172.16.10.1
    security: 6
    proxy: true
    firewall: true
    monitor: true
    files:
      - path: /pub/hours.txt
        size_mb: 1
        content: |
          Meridian Savings. Accounts opened at any branch. Our systems are
          audited twice a year and we have never lost a customer's money.
      - path: /data/accounts.db
        size_mb: 15
        sensitive: true
        content: Every account held at the bank, with its balance and its holder.
      - path: /admin/audit-q3.doc
        size_mb: 3
        content: |
          Third-quarter audit: passed. One finding, carried over from last
          year: the proxy and the firewall are managed by the same team, so
          one careless change opens both.

  # The branch terminal: the weak point of a bank that is otherwise hard, and
  # the first machine a new agent can really take. A bank notices quickly,
  # so taking something from here and leaving the log alone costs money.
  - id: meridian-branch
    name: Meridian Savings, Branch Terminal
    ip: 172.16.10.9
    security: 2
    location: { x: 58, y: 33 }
    files:
      - path: /pub/opening.txt
        size_mb: 1
        content: |
          Branch hours and the forms you can ask for at the counter.
      - path: /data/daybook.db
        size_mb: 3
        sensitive: true
        content: |
          The day's takings, account by account, as the counter entered them.
      - path: /sys/terminal.cfg
        size_mb: 1
        content: |
          Terminal 11, branch 4. Connected to the main system twice a day,
          which is also how often anybody looks at this log.
