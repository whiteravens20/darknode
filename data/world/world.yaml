# The world's starting point. Every player shares this catalogue; what a
# player does to the world is kept per run, beside it.

# The in-fiction date the world starts from. The shared clock counts from the
# moment the instance was first started, at sixty times real speed.
epoch: 2049-01-01T00:00:00Z

start:
  # The addresses a new agent already has.
  links:
    - practice-machine
    - darknode-help
    - internic
    - meridian-savings
    # Your own bank's branch terminal. Weak, and the first machine worth
    # taking something from.
    - meridian-branch
  # The bank that holds the first account.
  bank: meridian-savings
  # The programs a new gateway comes with.
  software:
    - { id: pass_breaker, version: 1 }
    - { id: log_wiper, version: 1 }
    # Without a probe an agent cannot see what stands in front of a server,
    # and at a hundred credits the shop is out of reach, so the first contract
    # would be taken blind.
    - { id: address_probe, version: 1 }
    # And the two programs a contract is done with. The board offers both
    # kinds of work from the first minute, so a kit that could only do one of
    # them would strand a new agent on the wrong draw. What the shop is for is
    # the next layer in: the firewall, the proxy, a faster processor.
    - { id: file_copier, version: 1 }
    - { id: file_shredder, version: 1 }
