# ── Archivum Null — Release ───────────────────────────────────────────────────
#
# Triggered by a semver tag (v1.2.3) pushed from the main branch.
# Tags created on any other branch are silently ignored.
# Builds a hardened production Docker image, pushes it to GitHub Container
# Registry (ghcr.io) by its digest alone, scans that digest for HIGH/CRITICAL
# CVEs, and only when the scan passed puts the tags on it and publishes the
# GitHub Release.
#
# ── Required repository configuration ────────────────────────────────────────
#
# No repository variables are required. All runtime configuration is read
# from the operator's .env file at container start via /api/config.
#
# ── Image ─────────────────────────────────────────────────────────────────────
# Published to: ghcr.io/<owner>/<repo>
# Example tags produced by v1.2.3:
#   ghcr.io/whiteravens20/archivum-null:1.2.3
#   ghcr.io/whiteravens20/archivum-null:1.2
#   ghcr.io/whiteravens20/archivum-null:1
#   ghcr.io/whiteravens20/archivum-null:main
#
# ℹ️  :main is ONLY updated by this workflow on a versioned semver release.
#    It always points to the most recent stable production build.
#    The :latest tag is intentionally NOT published — it is ambiguous by Docker
#    convention (simply the last image built, not necessarily stable).
#    For a pre-release snapshot of the main branch, use :edge (docker-snapshot.yml).
# ─────────────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Job 0: guard — ensure tag points to a commit on main ────────────────────
  # github.event.base_ref is unreliable for tags pushed via `git push origin <tag>`
  # (it is only populated reliably when the tag is created through the GitHub UI).
  # This job checks out the repo and uses `git branch --contains` to confirm the
  # tagged commit is actually reachable from main before the build runs.
  check-branch:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      on-main: ${{ steps.check.outputs.on-main }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0   # full history needed for branch containment check
      - name: Check branch containment
        id: check
        run: |
          if git branch -r --contains "${{ github.sha }}" | grep -q 'origin/main'; then
            echo "on-main=true" >> "$GITHUB_OUTPUT"
          else
            echo "on-main=false" >> "$GITHUB_OUTPUT"
            echo "::error::Tag ${{ github.ref_name }} does not point to a commit on main. Release skipped."
          fi

  # ── Job 1: build and push image ─────────────────────────────────────────────
  build-push:
    name: Build & push Docker image
    needs: check-branch
    if: needs.check-branch.outputs.on-main == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # Required to push to ghcr.io
      id-token: write   # Sign the provenance attestation
      attestations: write

    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags:   ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Compute Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Produce 4 tags from a vX.Y.Z push:
          #   :X.Y.Z  (exact version)
          #   :X.Y    (minor)
          #   :X      (major)
          #   :main   (stable production — always the most recent versioned release)
          # NOTE: :latest is intentionally omitted — it is ambiguous by Docker
          # convention and could mislead users into pulling a snapshot.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=main
          # Propagate VCS labels for traceability
          labels: |
            org.opencontainers.image.title=Archivum Null
            org.opencontainers.image.description=Zero trust encrypted file relay
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN is automatically provided — no secret configuration needed
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # No tag yet: the `tag` job puts the tags on this digest after the scan.
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache — dramatically speeds up repeated builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Generate SBOM and provenance attestations for supply-chain transparency
          provenance: true
          sbom: true

      # Sigstore-signed build provenance, pushed to ghcr.io next to the image.
      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # ── Tags: only on an image the scan passed ──────────────────────────────────
  # The image was pushed by its digest alone. Once the scan of that digest has
  # passed, every tag of the release is put on it, and each must then name the
  # very digest that was scanned: a pull of a version, of :main or of :latest
  # never meets an image the scan failed. The GitHub Release waits for this job.
  tag:
    name: Tag the scanned image
    needs: [check-branch, build-push, scan]
    if: needs.check-branch.outputs.on-main == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Put the tags on the scanned digest
        env:
          TAGS: ${{ needs.build-push.outputs.tags }}
          DIGEST: ${{ needs.build-push.outputs.digest }}
        run: |
          args=()
          while IFS= read -r tag; do [ -n "$tag" ] && args+=(--tag "$tag"); done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            got=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')
            [ "$got" = "$DIGEST" ] || { echo "::error::$tag names $got, not the scanned $DIGEST"; exit 1; }
            echo "$tag -> $got"
          done <<< "$TAGS"

  # ── Job 2: GitHub Release with auto-generated changelog ─────────────────────
  # Creates (or updates) the GitHub Release for this tag.
  # GitHub's built-in release notes generator groups merged PRs by label,
  # lists direct commits, and credits every contributor automatically.
  # Configure grouping labels in .github/release.yml (distinct from this file).
  github-release:
    name: Create GitHub Release
    needs: [check-branch, build-push, scan, tag]
    if: needs.check-branch.outputs.on-main == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Required to create/update the release
      id-token: write   # Sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0  # needed to compare tag with previous tag

      - name: Extract tag message
        id: tag-msg
        run: |
          MSG=$(git tag -l --format='%(contents)' "${{ github.ref_name }}" | sed '/-----BEGIN SSH SIGNATURE-----/,/-----END SSH SIGNATURE-----/d' | head -100)
          {
            echo "message<<GH_EOF"
            echo "$MSG"
            echo "GH_EOF"
          } >> "$GITHUB_OUTPUT"

      # Image tags drop the leading v of the git tag.
      - name: Image version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release tarball
        run: |
          VERSION="${{ github.ref_name }}"
          ARCHIVE_NAME="archivum-null-${VERSION}.tar.gz"

          tar czf "${ARCHIVE_NAME}" \
            --exclude='node_modules' \
            --exclude='coverage' \
            --exclude='dist' \
            --exclude='__tests__' \
            --exclude='*.test.ts' \
            --exclude='*.test.tsx' \
            --exclude='vitest.config.ts' \
            --exclude='eslint.config.js' \
            --exclude='frontend/src/test' \
            Dockerfile \
            docker-compose.yml \
            .dockerignore \
            .env.example \
            backend/package.json \
            backend/package-lock.json \
            backend/tsconfig.json \
            backend/src/ \
            frontend/package.json \
            frontend/package-lock.json \
            frontend/.npmrc \
            frontend/tsconfig.json \
            frontend/tsconfig.node.json \
            frontend/vite.config.ts \
            frontend/index.html \
            frontend/public/ \
            frontend/src/ \
            TOS.md \
            LICENSE \
            README.md \
            docs/ \
            scripts/

          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "$GITHUB_ENV"

      # Sigstore-signed build provenance for the tarball. The bundle is attached to
      # the release so the attestation travels with the file.
      - name: Attest tarball provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ARCHIVE_NAME }}

      - name: Keep the attestation bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "${ARCHIVE_NAME}.sigstore.json"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # Auto-generate body from GitHub's release notes API:
          # groups PRs by label, lists commits, credits contributors.
          generate_release_notes: true
          # Append Docker image reference to the generated notes.
          append_body: true
          # Attach the source tarball (only files needed to build & run) and its
          # attestation bundle
          files: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sigstore.json
          body: |
            ${{ steps.tag-msg.outputs.message }}

            ---
            ## Docker image

            ```
            docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ```

            | Tag | Description |
            |---|---|
            | `:${{ steps.version.outputs.version }}` | This exact release (immutable) |
            | `:main` | Always the latest stable production release |

            > **Digest (immutable):** `${{ needs.build-push.outputs.digest }}`

            ## Source tarball

            The attached `archivum-null-${{ github.ref_name }}.tar.gz` contains only the files needed to build and run the project (no tests, coverage, or CI config).

            ## Verifying

            ```
            gh attestation verify archivum-null-${{ github.ref_name }}.tar.gz --repo ${{ github.repository }}
            gh attestation verify oci://ghcr.io/${{ github.repository }}@${{ needs.build-push.outputs.digest }} --repo ${{ github.repository }}
            ```

            `archivum-null-${{ github.ref_name }}.tar.gz.sigstore.json` is the same attestation as a file, for `gh attestation verify --bundle`.

  # ── Job 3: Trivy scan on pushed image ────────────────────────────────────────
  # Pulls the freshly pushed image by immutable digest and scans for HIGH/CRITICAL
  # CVEs. exit-code: 1 fails the workflow on any unacknowledged finding.
  # Add CVE IDs to .trivyignore (with justification) to acknowledge and unblock.
  # Results are also uploaded to GitHub Security tab as SARIF regardless of outcome.
  scan:
    name: Trivy image scan
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read          # Pull image from ghcr.io
      security-events: write  # Upload SARIF to Security tab

    steps:
      - name: Checkout (for .trivyignore)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan for HIGH/CRITICAL CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          # Use the immutable digest — never a mutable tag — for reproducibility
          image-ref: ghcr.io/${{ github.repository }}@${{ needs.build-push.outputs.digest }}
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
          exit-code: '1'
          format: sarif
          output: trivy-release.sarif

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: trivy-release.sarif
          category: trivy-release

