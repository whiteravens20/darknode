name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest

    # The database tests run against a real PostgreSQL, because what they
    # check is the schema and its constraints. DARKNODE_TEST_REQUIRE_DB makes
    # a missing database fail the run instead of quietly skipping the tests.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      DARKNODE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      DARKNODE_TEST_REQUIRE_DB: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '^tools/' || true)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check the module files are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 ./...

  client:
    name: Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      # One Prettier config at the root covers every file it reads: the
      # client, the docs, the workflows and the world's data.
      - name: Check formatting
        working-directory: .
        run: |
          npm ci --ignore-scripts
          npm run format:check

      - name: Install
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  e2e:
    name: End to end
    runs-on: ubuntu-latest

    # The browser test drives a whole instance — this server, this database,
    # this client, in a real browser — and walks the path a new player walks.
    # It is the only check that can see the three disagree: the client calling
    # an endpoint the server does not have type-checks, lints and passes every
    # test on either side of it.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      DARKNODE_E2E_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json

      # The server serves the built client, as it does in the image, so the
      # test meets the files a player would get.
      - name: Build the client
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Install the test's packages
        working-directory: e2e
        run: npm ci --ignore-scripts

      - name: Install the browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # The configuration starts the server itself and waits for its health
      # check before the first page is opened.
      - name: Walk the player's path in a browser
        working-directory: e2e
        run: npm test

      # The report carries the trace and the screenshot of the moment it
      # failed, which is the only way to see afterwards what the browser saw.
      - name: Keep the report of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  image:
    name: Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        run: docker build -t darknode:ci .

      # What ships must hold no shell and no package manager: a flaw in the
      # game then has nothing to run. This fails if one ever appears.
      - name: Check the image has no shell or package manager
        run: |
          for tool in sh bash ash dash busybox apk apt npm node; do
            if docker run --rm --entrypoint "$tool" darknode:ci --version >/dev/null 2>&1; then
              echo "::error::$tool can be run inside the image"
              exit 1
            fi
          done
          echo "no shell and no package manager in the image"

      - name: Check it does not run as root
        run: |
          user=$(docker image inspect darknode:ci --format '{{.Config.User}}')
          case "$user" in
            ''|root|0|0:0) echo "::error::the image runs as $user"; exit 1 ;;
            *) echo "the image runs as $user" ;;
          esac

      - name: Check the binary answers
        run: docker run --rm darknode:ci version
