# ── Dependabot configuration ──────────────────────────────────────────────────
# Keeps GitHub Actions, the Go modules, the client's npm packages and the
# Docker base images up to date. Pull requests open against `dev`.
#
# Supply-chain quarantine: every ecosystem sets `cooldown: 7`, so a version is
# never proposed until it has been public for a week. That is the enforcement
# point of the policy — a version too fresh never becomes a pull request, so
# it cannot be merged early. Security updates are exempt and land at once.

version: 2

updates:
  # ── GitHub Actions ───────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
      time: '08:00'
      timezone: UTC
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
    # A tag can be repointed or a release yanked in the hours after it lands,
    # and none of these bumps is urgent. An action pinned by SHA gets no
    # Dependabot alert, so the "Actions audit" job watches the advisory
    # database in its place.
    cooldown:
      default-days: 7
    groups:
      actions-non-breaking:
        update-types:
          - minor
          - patch

  # ── The server ───────────────────────────────────────────────────────────────
  - package-ecosystem: gomod
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: UTC
    labels:
      - dependencies
      - server
    commit-message:
      prefix: chore(server)
    cooldown:
      default-days: 7
    groups:
      server-non-breaking:
        update-types:
          - minor
          - patch

  # ── The tools the checks run ────────────────────────────────────────────────
  - package-ecosystem: gomod
    directory: /tools
    target-branch: dev
    schedule:
      interval: monthly
      time: '08:00'
      timezone: UTC
    labels:
      - dependencies
      - tooling
    commit-message:
      prefix: chore(tools)
    cooldown:
      default-days: 7
    groups:
      tools-non-breaking:
        update-types:
          - minor
          - patch

  # ── The browser client ───────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /web
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: UTC
    labels:
      - dependencies
      - client
    commit-message:
      prefix: chore(web)
    cooldown:
      default-days: 7
    groups:
      client-non-breaking:
        update-types:
          - minor
          - patch

  # ── The base images ──────────────────────────────────────────────────────────
  # The Dockerfile pins each image by version and digest. A new minor or patch
  # moves the two together; a rebuild of the same version moves the digest
  # alone.
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: UTC
    labels:
      - dependencies
    commit-message:
      prefix: chore(docker)
    cooldown:
      default-days: 7
    # A new major of Go or Node is a change to the project, made by hand
    # together with the versions the workflows name.
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
