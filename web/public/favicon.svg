<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="DarkNode">
  <!-- The same mark as the icon, redrawn by hand on a 32-unit grid so that it
       stays sharp at 16 px: the prompt a terminal draws, in emerald, on the
       dark the game is played in. -->
